<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#032674">
<title>Members only | Youth for Positive Change</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0a5fd6;--blue-d:#0a3d9e;--navy:#032674;--leaf:#2f9e1a;--gold:#f6b800;--ink:#0f1b33;--muted:#52607a;--bg:#f4f8fe;--line:#d6e0f0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.stripe{display:flex;height:6px}.stripe i{flex:1}.stripe i:nth-child(1){background:var(--blue)}.stripe i:nth-child(2){background:var(--leaf)}.stripe i:nth-child(3){background:var(--gold)}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
.box{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 10px 30px rgba(3,38,116,.10);text-align:center}
.logo{width:84px;height:84px;object-fit:contain;margin:0 auto 14px;display:block}
h1{font-family:Fraunces,Georgia,serif;font-size:1.7rem;color:var(--navy);margin-bottom:8px;line-height:1.15}
.lead{color:var(--muted);font-size:.95rem;line-height:1.5;margin-bottom:22px}
form{text-align:left}
label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fafcff;color:var(--ink)}
input:focus,button:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,95,214,.2)}
.show{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:0 14px;font:600 .85rem Inter,sans-serif;cursor:pointer}
.go{width:100%;margin-top:14px;padding:13px 20px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:600 1rem Inter,sans-serif;cursor:pointer}
.go:hover:not(:disabled){background:var(--blue-d)}
.go:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;margin-top:12px;font-size:.88rem;font-weight:500;text-align:center;color:var(--muted)}
#msg.err{color:#b42318}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <div class="box">
    <img class="logo" src="logo.png" alt="Youth for Positive Change logo" onerror="this.style.display='none'">
    <h1>Members only</h1>
    <p class="lead">This page is password protected. Enter the password to open the Member Card Generator.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus>
        <button class="show" id="tg" type="button" aria-controls="pw">Show</button>
      </div>
      <button class="go" id="go" type="submit">Unlock</button>
      <p id="msg" role="alert" aria-live="polite"></p>
    </form>
  </div>
</main>

  function b64(s) {

  async function decrypt(password) {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);

      {name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256'},
